   const ls=Object.values(q).sort((a,b)=>a.ord-b.ord),qB=[...new Set(ls.map(e=>e.blk))],kB=[...new Set(Object.values(key).sort((a,b)=>a.ord-b.ord).map(e=>e.blk))],qs=ls.map(e=>{const si=qB.indexOf(e.blk),ke=key[kB[si]+'|'+e.n],tk=(kt[si]||{})[e.n],i=ke?keyInfo(ke):{},x=qText(e.t),nd=SCAN||e.g||x.opts.length<5||x.opts.some(o=>!o)||/\b(tabel|gambar|matriks|diagram|grafik|diputar|cermin)\b/i.test(x.stem);
    return{n:e.n,blk:e.blk,t:e.sec!='X'?e.sec:(ty||'TIU'),txt:x.stem,opts:x.opts,img:nd?stitch(e.c):null,key:i.a||(tk&&tk.a),link:(tk&&tk.link)||'',pts:i.pts,topic:i.topic||'',exp:ke?expText(ke.t):'',expImg:ke?stitch(ke.c):null,eImg:!!(ke&&(ke.g||/[=≈×]/.test(ke.t.join(' '))))}});
   if(!qs.length)throw new Error(nIt?'tidak ada nomor soal yang dikenali (pastikan nomor soal di kiri tiap soal, mis. "1." atau "1")':'PDF ini tidak bisa dibaca sama sekali (kosong atau terlalu buram)');pending={id:Date.now(),name:$('#nm').value||f.name,qs};vReview()}catch(e){st.textContent='Gagal: '+e.message}}}
const ea=s=>esc(s).replace(/"/g,'&quot;');
function hd(q){return'No. '+q.n+' · '+q.t+' · '+(q.t=='TKP'?(q.pts?'poin '+Object.entries(q.pts).map(e=>e.join('=')).join(' '):'tanpa poin'):'kunci '+(q.key||'-'))+' · '+(q.img?'gambar':'teks')+' · '+(q.topic||'(tanpa topik)')}
function sum(){const qs=pending.qs,miss=[],bl=[...new Set(qs.map(q=>q.blk))];
 bl.forEach((b,i)=>{const ns=qs.filter(q=>q.blk==b),m=ns.map(q=>q.n);for(let j=1;j<=Math.max(...m);j++)if(!m.includes(j))miss.push(ns[0].t+(bl.length>1?' #'+(i+1):'')+' '+j)});
 const nk=qs.filter(q=>q.t!='TKP'&&!q.key).map(q=>q.n),tk=qs.filter(q=>q.t=='TKP'&&!q.pts).map(q=>q.n);
 $('#sm').innerHTML=qs.length+' soal terbaca ('+['TWK','TIU','TKP'].map(t=>t+' '+qs.filter(q=>q.t==t).length).join(', ')+').'+(miss.length?'<br>Nomor tidak terbaca: '+miss.join(', ')+'<br><span class="mu">Kalau nomornya salah baca, ketuk soalnya lalu ubah nomornya. Soal yang memang hilang tidak bisa ditambah, abaikan saja.</span>':'')+(nk.length?'<br>Tanpa kunci: '+nk.join(', '):'')+(tk.length?'<br>TKP tanpa poin (nilai 0): '+tk.join(', '):'')+'<br><span class="mu">Ketuk satu soal untuk mengedit atau menghapusnya.</span>'}
function vReview(){pending.open=new Set();
 H('<h2>Cek hasil</h2><div class="card" id="sm"></div><div class="card"><b>Isi topik massal</b><div class="row"><select id="bt" style="width:80px"><option>TIU</option><option>TWK</option><option>TKP</option></select><input id="a" type="number" placeholder="dari" style="width:70px"><input id="b" type="number" placeholder="sampai" style="width:80px"><input id="tp" placeholder="Topik, mis. Figural" style="flex:1"><button onclick="setTp()">Isi</button></div></div><div id="lst"></div><div class="row"><button class="p" onclick="saveSet()">Simpan</button><button onclick="vHome()">Batal</button></div>');lst()}
function lst(){sum();$('#lst').innerHTML=pending.qs.map((q,i)=>'<div class="card"><div id="h'+i+'" onclick="pv('+i+')" style="cursor:pointer">'+hd(q)+'</div><div id="pv'+i+'"></div></div>').join('');pending.open.forEach(fillPv)}
function pv(i){const o=pending.open;if(o.has(i))o.delete(i);else o.add(i);lst()}
function fillPv(i){const q=pending.qs[i],e=$('#pv'+i);if(!e)return;
 e.innerHTML='<div class="card" style="background:var(--bg)"><div class="row"><label>No.<input type="number" value="'+q.n+'" style="width:80px" onchange="ed('+i+',\'n\',this.value)"></label><label>Materi<select onchange="ed('+i+',\'t\',this.value)">'+['TWK','TIU','TKP'].map(t=>'<option'+(t==q.t?' selected':'')+'>'+t+'</option>').join('')+'</select></label>'+(q.t=='TKP'?'':'<label>Kunci<select onchange="ed('+i+',\'key\',this.value)">'+['','A','B','C','D','E'].map(k=>'<option'+(k==(q.key||'')?' selected':'')+'>'+k+'</option>').join('')+'</select></label>')+'</div>'+
 (q.t=='TKP'?'<div class="row">Poin: '+'ABCDE'.split('').map(l=>'<label>'+l+'<input type="number" min="1" max="5" value="'+((q.pts||{})[l]||'')+'" style="width:56px" onchange="edPt('+i+',\''+l+'\',this.value)"></label>').join('')+'</div>':'')+
 '<label>Topik<input value="'+ea(q.topic||'')+'" onchange="ed('+i+',\'topic\',this.value)"></label><button onclick="delQ('+i+')">Hapus soal ini</button></div>'+qBody(q)+optList(q,1)+expHtml(q)}
function ed(i,f,v){const q=pending.qs[i];if(f=='n')q.n=+v||0;else if(f=='key')q.key=v||'';else if(f=='t')q.t=v;else q[f]=v.trim();
 if(f=='t'){lst();return}$('#h'+i).textContent=hd(q);sum()}
function edPt(i,l,v){const q=pending.qs[i];q.pts=q.pts||{};if(v==='')delete q.pts[l];else q.pts[l]=Math.min(5,Math.max(1,+v||1));if(!Object.keys(q.pts).length)q.pts=null;$('#h'+i).textContent=hd(q);sum()}
function delQ(i){if(confirm('Hapus soal ini dari hasil impor?')){pending.qs.splice(i,1);pending.open=new Set();lst()}}
function setTp(){const a=+$('#a').value,b=+$('#b').value,t=$('#tp').value.trim();pending.qs.forEach(q=>{if(q.t==$('#bt').value&&q.n>=a&&q.n<=b)q.topic=t});lst()}
async function saveSet(){delete pending.open;const bs=[...new Set(pending.qs.map(q=>q.blk))],ts=bs.map(b=>pending.qs.find(q=>q.blk==b).t);
 if(bs.length>1&&new Set(ts).size<bs.length){for(let i=0;i<bs.length;i++)await putSet({id:pending.id+i,name:pending.name+' #'+(i+1),qs:pending.qs.filter(q=>q.blk==bs[i])})}else await putSet(pending);vHome()}
async function start(){const ids=[...document.querySelectorAll('.ck:checked')].map(c=>+c.value);if(!ids.length){alert('Pilih minimal satu set.');return}
 const ss=(await allSets()).filter(s=>ids.includes(s.id));S={qs:ss.flatMap(s=>s.qs.map((q,i)=>({...q,sid:s.id,qi:i}))),ans:[],i:0,end:Date.now()+(+$('#tm').value||1)*60000};S.tm=setInterval(tick,1000);vTest()}
function tick(){const s=Math.max(0,Math.round((S.end-Date.now())/1000)),e=$('#tmr');if(e)e.textContent='⏱ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!s)fin(0)}
const padBtn=q=>q.t=='TIU'?'<button onclick="openPad()">✎ Coret'+((S.sk&&S.sk[S.i]&&S.sk[S.i].length)?' •':'')+'</button>':'';
function closePad(){const o=$('#pad');if(o){clearInterval(o.tk);o.remove()}document.body.style.overflow=''}
function openPad(){
 const st=(S.sk=S.sk||{})[S.i]=(S.sk[S.i]||[]),q=S.qs[S.i];let col='#111',tool='p',cur=null,showQ=true;
 const o=document.createElement('div');o.id='pad';
 o.innerHTML='<div class="pb"><button class="p" id="pk">Kembali ke soal</button><b id="tmr2"></b><button id="pp" class="on">Pena</button><button id="pe">Penghapus</button><button class="cd" data-c="#111" style="background:#111"></button><button class="cd" data-c="#d32f2f" style="background:#d32f2f"></button><button class="cd" data-c="#1565c0" style="background:#1565c0"></button><button id="pu">Undo</button><button id="pa">Bersihkan</button><button id="pq" class="on">Soal</button></div><div class="pw"><div id="pqv">'+qBody(q)+optList(q,1)+'</div><canvas id="cv"></canvas></div>';
 document.body.appendChild(o);document.body.style.overflow='hidden';
 const cv=o.querySelector('#cv'),g=cv.getContext('2d'),B=id=>o.querySelector(id);
 const dr=a=>{g.save();g.globalCompositeOperation=a.t=='e'?'destination-out':'source-over';g.strokeStyle=a.c;g.lineWidth=a.w;g.lineCap=g.lineJoin='round';g.beginPath();a.p.forEach((u,i)=>i?g.lineTo(u[0],u[1]):g.moveTo(u[0],u[1]));if(a.p.length==1)g.lineTo(a.p[0][0]+.1,a.p[0][1]);g.stroke();g.restore()};
 const redraw=()=>{g.clearRect(0,0,cv.width,cv.height);st.forEach(dr)};
 const fit=()=>{const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;g.setTransform(d,0,0,d,0,0);redraw()};

 cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);cur={t:tool,c:col,w:tool=='e'?22:3,p:[pt(e)]};st.push(cur);redraw()};

 const mode=t=>{tool=t;B('#pp').classList.toggle('on',t=='p');B('#pe').classList.toggle('on',t=='e')};
 B('#pp').onclick=()=>mode('p');B('#pe').onclick=()=>mode('e');
 o.querySelectorAll('.cd').forEach(b=>b.onclick=()=>{col=b.dataset.c;mode('p')});
 B('#pu').onclick=()=>{st.pop();redraw()};
 B('#pa').onclick=()=>{if(confirm('Hapus semua coretan di soal ini?')){st.length=0;redraw()}};
 B('#pq').onclick=()=>{showQ=!showQ;B('#pqv').style.display=showQ?'block':'none';B('#pq').classList.toggle('on',showQ)};
 B('#pk').onclick=()=>{closePad();vTest()};
 o.tk=setInterval(()=>{const e=$('#tmr'),f=$('#tmr2');if(e&&f)f.textContent=e.textContent},400);
 addEventListener('resize',fit);fit()}
function vTest(){const q=S.qs[S.i],a=S.ans,n=S.qs.length,d=a.filter(Boolean).length;
 H('<div class="card"><div class="row" style="justify-content:space-between"><b>Simulasi CAT SKD</b><b id="tmr"></b></div><div class="mu">'+d+' / '+n+' dijawab</div><div class="bar"><i style="width:'+100*d/n+'%"></i></div></div><div class="lay"><details class="card nv"'+(innerWidth>700?' open':'')+'><summary><b>Navigasi Soal</b></summary><div class="grid" style="margin-top:8px">'+S.qs.map((x,i)=>'<button class="'+(a[i]?'a ':'')+(i==S.i?'cur':'')+'" onclick="S.i='+i+';vTest()">'+(i+1)+'</button>').join('')+'</div></details><div class="card" style="flex:1;min-width:0"><div class="row" style="justify-content:space-between"><h3 style="margin:4px 0">Soal '+(S.i+1)+' dari '+n+'</h3><span class="row">'+padBtn(q)+'<button class="p" onclick="fin(1)">Selesai</button></span></div><span class="bd">'+TN[q.t]+'</span>'+qBody(q)+optList(q)+'<div class="row" style="margin-top:12px"><button onclick="go(-1)">◀</button><button class="p" onclick="go(1)">Simpan dan Lanjutkan</button><button style="margin-left:auto" onclick="go(1)">Lewatkan</button></div></div></div>');tick()}
function gridT(){const g=$('#gd');if(g.style.display=='none'){g.style.display='block';g.innerHTML='<div class="grid">'+S.qs.map((q,i)=>'<button class="'+(S.ans[i]?'a ':'')+(i==S.i?'cur':'')+'" onclick="S.i='+i+';vTest()">'+(i+1)+'</button>').join('')+'</div>'}else g.style.display='none'}
function pick(l){S.ans[S.i]=S.ans[S.i]==l?undefined:l;vTest()}
function go(d){S.i=Math.min(S.qs.length-1,Math.max(0,S.i+d));vTest();scrollTo(0,0)}
function fin(c){const un=S.qs.filter((_,i)=>!S.ans[i]).length;if(c&&!confirm('Selesaikan tes? '+un+' soal belum dijawab.'))return;clearInterval(S.tm);closePad();
 const rows=S.qs.map((q,i)=>grade(q,S.ans[i]));
 const h=hist();h.push({d:Date.now(),rows:rows.map(r=>({t:r.t,k:r.topic,p:r.p,m:r.m})),det:S.qs.map((q,i)=>({s:q.sid,i:q.qi,a:S.ans[i]||null}))});localStorage.setItem('hist',JSON.stringify(h));vRes(rows)}
const grade=(q,a)=>{let p=0,m=5;if(q.t=='TKP'){if(!q.pts)m=0;else if(a)p=q.pts[a]||0}else if(!q.key)m=0;else if(a&&a==q.key)p=5;return{t:q.t,topic:q.topic||'umum',p,m,a,q}};
let ERR=[];
const kunciTxt=q=>q.t=='TKP'&&q.pts?Object.entries(q.pts).sort((a,b)=>b[1]-a[1])[0][0]:q.key;
function cpErr(){const t='Tolong rangkum materi apa saja yang perlu saya pelajari dari soal-soal yang saya jawab salah berikut. Kelompokkan per topik dan jelaskan singkat apa yang harus saya cari.\n\n'+ERR.map(r=>{const q=r.q;return'['+r.t+' · '+(r.topic=='umum'?'tanpa topik':r.topic)+'] No. '+q.n+'\n'+(q.img?'(soal bergambar/tabel)':q.txt+'\n'+q.opts.map((o,i)=>'ABCDE'[i]+'. '+o).join('\n'))+'\nJawaban saya: '+(r.a||'kosong')+(q.t=='TKP'?' ('+r.p+' poin)':'')+' | Kunci: '+kunciTxt(q)+(q.exp?'\nPembahasan: '+q.exp.slice(0,400):'')}).join('\n\n');
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Tersalin. Tempel di chat Claude.')).catch(()=>prompt('Salin teks ini:',t))}
function vRes(rows,back,ttl){const T=agg(rows,r=>'T').T||{p:0,m:0},ok=rows.filter(r=>r.m&&r.p==r.m),bad=rows.filter(r=>r.m&&r.p<r.m),nk=rows.filter(r=>!r.m).length;ERR=bad;
 const nm=r=>r.t+' · '+(r.topic=='umum'?'(sub materi belum diisi)':r.topic),gr={},tot={};
 bad.forEach(r=>{(gr[nm(r)]=gr[nm(r)]||[]).push(r)});rows.forEach(r=>{if(r.m){const k=nm(r);tot[k]=tot[k]||{p:0,m:0};tot[k].p+=r.p;tot[k].m+=r.m}});
 const weak=Object.keys(gr).sort((a,b)=>tot[a].p/tot[a].m-tot[b].p/tot[b].m),sn=q=>q.img?'(soal bergambar/tabel, lihat pembahasannya di atas)':esc(q.txt.length>110?q.txt.slice(0,110)+'…':q.txt);
 const item=r=>{const q=r.q;return'<details class="card it" open><summary>'+(r.p==r.m?'✓ ':'✗ ')+'No. '+q.n+' ('+q.t+') · jawabanmu '+(r.a||'kosong')+(q.t=='TKP'&&r.a?' ('+r.p+' poin)':'')+' · kunci '+kunciTxt(q)+'</summary>'+qBody(q)+optList(q,1)+'<p><b>Pembahasan</b></p>'+expHtml(q)+'</details>'};
 H('<h2>Hasil</h2>'+(ttl?'<p class="mu">Riwayat: '+ttl+'</p>':'')+'<div class="card" style="text-align:center"><div style="font-size:42px;font-weight:700">'+T.p+'</div><div class="mu">dari '+T.m+' poin</div></div><div class="card"><b>Per materi</b>'+Object.entries(agg(rows,r=>r.t)).map(e=>bar(...e)).join('')+'</div><div class="card"><b>Per topik</b>'+Object.entries(agg(rows,r=>r.t+' · '+r.topic)).map(e=>bar(...e)).join('')+'</div>'+
 '<div class="row" style="margin:10px 0"><button onclick="document.getElementById(\'benar\').scrollIntoView()">Jawaban benar ('+ok.length+')</button><button onclick="document.getElementById(\'salah\').scrollIntoView()">Jawaban salah ('+bad.length+')</button><button onclick="document.querySelectorAll(\'details.it\').forEach(d=>d.open=!d.open)">Buka/tutup pembahasan</button></div>'+
 '<h3 id="benar">Jawaban benar ('+ok.length+')</h3>'+(ok.length?ok.map(item).join(''):'<p class="mu">Belum ada.</p>')+
 '<h3 id="salah">Jawaban salah ('+bad.length+')</h3>'+(bad.length?bad.map(item).join(''):'<p class="mu">Tidak ada.</p>')+
 '<div class="card"><b>Rangkuman kesalahan: yang perlu kamu cari</b>'+(weak.length?weak.map(k=>bar(k,tot[k])+gr[k].map(r=>'<div class="mu" style="margin:2px 0 8px">No. '+r.q.n+': '+sn(r.q)+'</div>').join('')).join('')+'<button onclick="cpErr()">Salin untuk dirangkum Claude</button>':'<p class="mu">Tidak ada. Semua soal yang bisa dinilai sudah benar.</p>')+'</div>'+
 (nk?'<p class="mu">'+nk+' soal tanpa kunci tidak ikut dinilai.</p>':'')+'<button class="p" onclick="'+(back||'vHome()')+'">'+(back?'Kembali':'Selesai')+'</button>')}
async function vDetail(i){const x=hist()[i],ss=await allSets(),m={};ss.forEach(t=>m[t.id]=t);
 const ds=x.det.filter(d=>m[d.s]&&m[d.s].qs[d.i]);if(!ds.length){alert('Soal untuk riwayat ini sudah dihapus dari daftar set, jadi detailnya tidak bisa ditampilkan.');return}
 vRes(ds.map(d=>grade(m[d.s].qs[d.i],d.a)),'vRekap()',new Date(x.d).toLocaleString('id-ID')+(ds.length<x.det.length?' (sebagian soal sudah dihapus)':''))}

function vRekap(){const h=hist(),rows=h.flatMap(x=>x.rows).map(r=>({t:r.t,topic:r.k,p:r.p,m:r.m})),tp=agg(rows,r=>r.t+' · '+r.topic),
 weak=Object.entries(tp).filter(e=>e[1].m).sort((a,b)=>a[1].p/a[1].m-b[1].p/b[1].m).slice(0,5);
 H('<h2>Rekap</h2>'+(h.length?'<div class="card"><b>Per materi ('+h.length+' try out)</b>'+Object.entries(agg(rows,r=>r.t)).map(e=>bar(...e)).join('')+'</div><div class="card"><b>Perlu ditingkatkan</b>'+weak.map(e=>bar(...e)).join('')+'</div><div class="card"><b>Semua topik</b>'+Object.entries(tp).map(e=>bar(...e)).join('')+'</div><div class="card"><b>Riwayat</b>'+h.map((x,i)=>[x,i]).reverse().map(([x,i])=>'<div class="row" style="justify-content:space-between;margin:6px 0"><span class="mu">'+new Date(x.d).toLocaleString('id-ID')+' — '+Object.entries(agg(x.rows.map(r=>({t:r.t,p:r.p,m:r.m})),r=>r.t)).map(([k,v])=>k+' '+v.p+'/'+v.m).join(' · ')+'</span>'+(x.det?'<button onclick="vDetail('+i+')">Lihat</button>':'')+'</div>').join('')+'</div><button onclick="clr()">Hapus riwayat</button> ':'<p class="mu">Belum ada riwayat.</p>')+'<button onclick="vHome()">Kembali</button>')}
function clr(){if(confirm('Hapus semua riwayat?')){localStorage.removeItem('hist');vRekap()}}
vHome();
</script></body></html>
